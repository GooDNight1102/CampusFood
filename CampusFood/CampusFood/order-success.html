<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt hàng thành công — CampusFood</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="cart">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container" style="max-width:520px;">
      <div class="panel text-center" style="padding:40px 28px;">
        <div style="width:70px;height:70px;border-radius:50%;background:var(--pine-100);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--success);">
          <span data-icon="check" style="width:34px;height:34px;"></span>
        </div>
        <h1 style="font-size:26px;">✓ Thanh toán thành công</h1>
        <p class="text-muted mt-8">Mã đơn hàng của bạn là</p>
        <div style="font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--pine-900); margin:8px 0 24px;" id="os-code">—</div>

        <div class="ticket-card" style="transform:none; text-align:left;">
          <div class="ticket-head"><b>Phiếu gọi món</b><span class="ticket-tag" id="os-slot">—</span></div>
          <div id="os-items"></div>
          <div class="ticket-total"><span>Tổng cộng</span><span id="os-total">0đ</span></div>
        </div>

        <div class="mt-32" style="display:flex; gap:12px;">
          <a href="tracking.html" class="btn btn-outline btn-block" id="os-track">Theo dõi đơn hàng</a>
          <a href="menu.html" class="btn btn-primary btn-block">Đặt thêm món</a>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="bottom-nav"></div>
<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const code = new URLSearchParams(location.search).get('code');
    const order = code ? cfGetOrderByCode(code) : null;
    if (!order){
      document.querySelector('main .container').innerHTML = `<div class="empty-state"><h3>Không tìm thấy đơn hàng</h3><a href="menu.html" class="btn btn-primary">Về thực đơn</a></div>`;
      return;
    }
    document.getElementById('os-code').textContent = order.code;
    document.getElementById('os-slot').textContent = order.pickupSlot + (order.priority ? ' · Ưu tiên GV' : '');
    document.getElementById('os-total').textContent = cfFormatVND(order.total);
    document.getElementById('os-items').innerHTML = order.items.map(i => `
      <div class="ticket-row"><span class="name">${i.name} <span class="qty">x${i.qty}</span></span><span>${cfFormatVND(i.price*i.qty)}</span></div>
    `).join('');
    document.getElementById('os-track').href = 'tracking.html?code=' + order.code;
  });
</script>
</body>
</html>
