<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tổng quan — Quản trị CampusFood</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Tổng quan</h1>
        <p class="sub">Theo dõi hoạt động căng tin theo thời gian thực.</p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="top"><span class="label">Doanh thu hôm nay</span><span class="stat-icon" style="background:var(--citrus-600);" data-icon="wallet"></span></div>
        <div class="value" id="stat-revenue">0đ</div>
      </div>
      <div class="stat-card">
        <div class="top"><span class="label">Đơn hàng hôm nay</span><span class="stat-icon" style="background:var(--pine-700);" data-icon="receipt"></span></div>
        <div class="value" id="stat-orders">0</div>
      </div>
      <div class="stat-card">
        <div class="top"><span class="label">Đơn đang xử lý</span><span class="stat-icon" style="background:var(--gold-500);" data-icon="clock"></span></div>
        <div class="value" id="stat-processing">0</div>
      </div>
      <div class="stat-card">
        <div class="top"><span class="label">Người dùng (SV/GV)</span><span class="stat-icon" style="background:var(--success);" data-icon="users"></span></div>
        <div class="value" id="stat-users">0</div>
      </div>
    </div>

    <div class="admin-grid-2">
      <div class="admin-panel">
        <div class="admin-panel-head"><h3>Doanh thu 7 ngày gần nhất</h3></div>
        <canvas class="chart-canvas" id="revenue-chart" height="220"></canvas>
      </div>
      <div class="admin-panel">
        <div class="admin-panel-head"><h3>Món bán chạy nhất</h3></div>
        <div id="top-products"></div>
      </div>
    </div>

    <div class="admin-panel mt-24">
      <div class="admin-panel-head"><h3>Đơn hàng mới nhất</h3><a href="orders.html" class="btn btn-ghost btn-sm">Xem tất cả →</a></div>
      <div id="recent-orders"></div>
    </div>
  </div>
</div>

<script src="../js/products.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!cfAdminBoot('dashboard', ['admin'])) return;
    cfFillIcons();
    cfRenderDashboard();
  });
</script>
</body>
</html>
