<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thực đơn — CampusFood</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="menu">

<div id="site-header"></div>

<main>
  <div class="container page-head">
    <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Thực đơn</div>
    <h1>Bạn muốn ăn gì hôm nay?</h1>
  </div>

  <section class="section" style="padding-top:20px;">
    <div class="container">
      <div class="search-bar">
        <span data-icon="search"></span>
        <input type="text" id="menu-search" placeholder="Tìm món ăn, đồ uống, đồ ăn vặt...">
      </div>

      <div class="filter-bar">
        <button class="chip active" data-cat="all">Tất cả</button>
        <button class="chip" data-cat="mon">Đồ ăn</button>
        <button class="chip" data-cat="uong">Đồ uống</button>
        <button class="chip" data-cat="vat">Đồ ăn vặt</button>
        <button class="chip" data-cat="bestseller">Món bán chạy</button>
        <button class="chip" data-cat="new">Món mới</button>
        <select class="select-sort" id="menu-sort">
          <option value="default">Sắp xếp: Mặc định</option>
          <option value="price-asc">Giá thấp → cao</option>
          <option value="price-desc">Giá cao → thấp</option>
          <option value="rating-desc">Đánh giá cao</option>
        </select>
      </div>

      <div id="menu-count" class="text-muted mt-8" style="margin-bottom:16px;font-size:13.5px;"></div>
      <div class="product-grid" id="menu-products"></div>
      <div class="empty-state" id="menu-empty" style="display:none;">
        <span data-icon="search"></span>
        <h3>Không tìm thấy món phù hợp</h3>
        <p>Hãy thử từ khoá khác hoặc chọn danh mục khác.</p>
      </div>
    </div>
  </section>
</main>

<div id="bottom-nav"></div>
<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/main.js"></script>
<script>
  let CF_MENU_STATE = { cat: 'all', sort: 'default', q: '' };

  function cfApplyMenuFilters(){
    let items = cfGetProducts();
    if (CF_MENU_STATE.cat === 'bestseller') items = items.filter(p => p.badge === 'bestseller');
    else if (CF_MENU_STATE.cat === 'new') items = items.filter(p => p.badge === 'new');
    else if (CF_MENU_STATE.cat !== 'all') items = items.filter(p => p.category === CF_MENU_STATE.cat);

    if (CF_MENU_STATE.q){
      const q = CF_MENU_STATE.q.toLowerCase();
      items = items.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
    }

    if (CF_MENU_STATE.sort === 'price-asc') items = [...items].sort((a,b)=>a.price-b.price);
    if (CF_MENU_STATE.sort === 'price-desc') items = [...items].sort((a,b)=>b.price-a.price);
    if (CF_MENU_STATE.sort === 'rating-desc') items = [...items].sort((a,b)=>b.rating-a.rating);

    const grid = document.getElementById('menu-products');
    const empty = document.getElementById('menu-empty');
    document.getElementById('menu-count').textContent = `${items.length} món`;
    if (items.length === 0){
      grid.innerHTML = ''; empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = items.map(cfProductCardHtml).join('');
      cfBindProductCardEvents();
    }
  }

  function cfInitMenuFromUrl(){
    const params = new URLSearchParams(location.search);
    if (params.get('cat')) CF_MENU_STATE.cat = params.get('cat');
    if (params.get('q')) CF_MENU_STATE.q = params.get('q');
    document.getElementById('menu-search').value = CF_MENU_STATE.q;
    document.querySelectorAll('.chip[data-cat]').forEach(c => c.classList.toggle('active', c.dataset.cat === CF_MENU_STATE.cat));
  }

  document.addEventListener('DOMContentLoaded', () => {
    cfInitMenuFromUrl();
    cfApplyMenuFilters();

    document.querySelectorAll('.chip[data-cat]').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip[data-cat]').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        CF_MENU_STATE.cat = chip.dataset.cat;
        cfApplyMenuFilters();
      });
    });
    document.getElementById('menu-sort').addEventListener('change', (e) => {
      CF_MENU_STATE.sort = e.target.value;
      cfApplyMenuFilters();
    });
    let searchTimer;
    document.getElementById('menu-search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { CF_MENU_STATE.q = e.target.value.trim(); cfApplyMenuFilters(); }, 200);
    });
  });
</script>
</body>
</html>
