<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý thực đơn — Quản trị CampusFood</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div><h1>Quản lý thực đơn</h1><p class="sub">Thêm, sửa, xoá món và cập nhật tồn kho hằng ngày.</p></div>
      <button class="btn btn-primary" id="btn-add-product">+ Thêm món</button>
    </div>

    <div class="admin-panel">
      <div class="toolbar">
        <div class="search-mini"><span data-icon="search"></span><input type="text" id="prod-search" placeholder="Tìm theo tên món..."></div>
        <select id="prod-filter-cat">
          <option value="all">Tất cả danh mục</option>
          <option value="mon">Đồ ăn</option>
          <option value="uong">Đồ uống</option>
          <option value="vat">Đồ ăn vặt</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Món</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
          <tbody id="products-admin-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="product-modal">
  <div class="modal-box" style="max-width:460px;">
    <h3 id="product-modal-title">Thêm món mới</h3>
    <form id="product-form">
      <div class="field"><label>Tên món</label><input type="text" id="pf-name" required></div>
      <div class="field-row">
        <div class="field"><label>Danh mục</label>
          <select id="pf-category">
            <option value="mon">Đồ ăn</option>
            <option value="uong">Đồ uống</option>
            <option value="vat">Đồ ăn vặt</option>
          </select>
        </div>
        <div class="field"><label>Giá (đ)</label><input type="number" id="pf-price" min="0" step="1000" required></div>
      </div>
      <div class="field"><label>Tồn kho</label><input type="number" id="pf-stock" min="0" required></div>
      <div class="field"><label>Mô tả</label><textarea id="pf-desc" rows="3"></textarea></div>
      <div class="field">
        <label>Ảnh món ăn (không bắt buộc)</label>
        <div class="image-upload-row">
          <div class="image-upload-preview" id="pf-image-preview"></div>
          <div class="image-upload-actions">
            <label class="btn btn-outline btn-sm" for="pf-image-file" style="cursor:pointer;">Tải ảnh lên</label>
            <input type="file" id="pf-image-file" accept="image/*" style="display:none;">
            <button type="button" class="btn btn-ghost btn-sm" id="pf-image-clear">Xoá ảnh</button>
          </div>
        </div>
        <input type="text" id="pf-image" placeholder="hoặc dán link ảnh https://..." style="margin-top:10px;">
        <div class="field-hint">Ảnh tải lên từ máy sẽ tự thu nhỏ trước khi lưu. Bỏ trống nếu chưa có ảnh — món sẽ hiển thị icon minh hoạ thay thế.</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="product-modal-cancel">Huỷ</button>
        <button type="submit" class="btn btn-primary">Lưu món ăn</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/products.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/promotions.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/orders.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!cfAdminBoot('products', ['staff','admin'])) return;
    cfFillIcons();
    cfRenderProductsAdmin();
    document.getElementById('product-modal-cancel').addEventListener('click', () => document.getElementById('product-modal').classList.remove('open'));
  });
</script>
</body>
</html>
