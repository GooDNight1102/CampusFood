<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết món ăn — CampusFood</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="menu">

<div id="site-header"></div>

<main>
  <div class="container page-head">
    <div class="breadcrumb"><a href="index.html">Trang chủ</a> / <a href="menu.html">Thực đơn</a> / <span id="pd-crumb"></span></div>
  </div>

  <section class="section" style="padding-top:16px;">
    <div class="container" id="pd-wrap" style="display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:start;">
      <!-- filled by JS -->
    </div>
  </section>

  <section class="section" style="background:var(--paper); border-top:1px solid var(--line);">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow-label">GỢI Ý</span><h2>Món tương tự</h2></div></div>
      <div class="product-grid" id="pd-related"></div>
    </div>
  </section>
</main>

<div id="bottom-nav"></div>
<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/main.js"></script>
<script>
  function renderProductDetail(){
    const id = new URLSearchParams(location.search).get('id');
    const p = cfGetProductById(id);
    if (!p){
      document.getElementById('pd-wrap').innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><h3>Không tìm thấy món ăn</h3><p>Món ăn này có thể đã bị gỡ khỏi thực đơn.</p><a href="menu.html" class="btn btn-primary">Về thực đơn</a></div>`;
      return;
    }
    document.getElementById('pd-crumb').textContent = p.name;
    document.title = p.name + ' — CampusFood';

    const out = p.stock <= 0;
    document.getElementById('pd-wrap').innerHTML = `
      <div>
        <div class="product-thumb" style="height:360px;border-radius:16px;--tc1:${cfThumbGradient(p.category).split(',')[0]};--tc2:${cfThumbGradient(p.category).split(',')[1]};">
          ${out ? '<span class="badge badge-out">Hết hàng</span>' : p.badge==='bestseller' ? '<span class="badge badge-bestseller">Bán chạy</span>' : p.badge==='new' ? '<span class="badge badge-new">Mới</span>' : ''}
          <span style="width:96px;height:96px;" data-icon="${cfCategoryIconKey(p.category)}"></span>
        </div>
      </div>
      <div>
        <span class="product-cat">${cfCategoryLabel(p.category).toUpperCase()}</span>
        <h1 style="font-size:30px;margin-top:8px;">${p.name}</h1>
        <div class="product-meta mt-16">
          <span class="rating">${CF_ICONS.star} ${p.rating.toFixed(1)}</span><span>·</span><span>${p.sold} đã bán</span><span>·</span>
          <span>${out ? 'Hết hàng' : `Còn ${p.stock} phần`}</span>
        </div>
        <p class="mt-16" style="color:var(--ink-70);font-size:15px;line-height:1.65;">${p.desc}</p>
        <div class="price mt-24" style="font-size:30px;">${cfFormatVND(p.price)}</div>

        <div class="mt-24 flex items-center gap-16">
          <div class="qty-stepper" style="height:46px;">
            <button type="button" id="pd-dec" style="width:44px;height:44px;">−</button>
            <span id="pd-qty" style="width:44px;">1</span>
            <button type="button" id="pd-inc" style="width:44px;height:44px;">+</button>
          </div>
          <button class="btn btn-primary" id="pd-add" style="flex:1;" ${out?'disabled':''}>${out ? 'Đã hết hàng' : 'Thêm vào giỏ hàng'}</button>
        </div>
        <a href="menu.html" class="btn btn-ghost mt-16">← Quay lại thực đơn</a>
      </div>`;
    cfFillIcons();

    let qty = 1;
    const qtyEl = document.getElementById('pd-qty');
    document.getElementById('pd-inc').addEventListener('click', () => { if (qty < p.stock) { qty++; qtyEl.textContent = qty; } });
    document.getElementById('pd-dec').addEventListener('click', () => { if (qty > 1) { qty--; qtyEl.textContent = qty; } });
    document.getElementById('pd-add').addEventListener('click', () => {
      const res = cfAddToCart(p.id, qty);
      if (res.ok) cfToast(`Đã thêm ${qty} ${p.name} vào giỏ hàng.`, 'success');
      else cfToast(res.message, 'error');
    });

    const related = cfGetProducts().filter(x => x.category === p.category && x.id !== p.id).slice(0,4);
    document.getElementById('pd-related').innerHTML = related.map(cfProductCardHtml).join('');
    cfBindProductCardEvents();
  }
  document.addEventListener('DOMContentLoaded', renderProductDetail);
</script>
</body>
</html>
