<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu đơn hàng — CampusFood</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="tracking">

<div id="site-header"></div>

<main>
  <div class="container page-head">
    <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Tra cứu đơn hàng</div>
    <h1>Tra cứu đơn hàng</h1>
    <p class="text-muted mt-8">Không cần đăng nhập — chỉ cần mã đơn và số điện thoại đã dùng khi đặt món.</p>
  </div>

  <section class="section" style="padding-top:20px;">
    <div class="container" style="max-width:640px;">
      <form class="panel" id="tracking-form">
        <div class="field-row">
          <div class="field" style="margin-bottom:0;">
            <label>Mã đơn hàng</label>
            <input type="text" id="tf-code" placeholder="VD: CF20260914001" required>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Số điện thoại</label>
            <input type="tel" id="tf-phone" placeholder="09xxxxxxxx" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-24">TRA CỨU ĐƠN HÀNG</button>
      </form>

      <div id="tracking-result" class="mt-24"></div>
    </div>
  </section>
</main>

<div id="bottom-nav"></div>
<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/main.js"></script>
<script>
  function renderTrackingResult(order){
    const wrap = document.getElementById('tracking-result');
    wrap.innerHTML = `
      <div class="panel">
        <div class="flex justify-between items-center">
          <div>
            <div class="eyebrow-label">MÃ ĐƠN ${order.code}</div>
            <h3 style="margin-top:4px;">${order.guestName}</h3>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
            <span class="status-pill ${cfOrderStatusPillClass(order.status)}">${cfOrderStatusLabel(order.status)}</span>
            ${order.priority ? '<span class="badge badge-bestseller" style="position:static;">Ưu tiên GV</span>' : ''}
          </div>
        </div>
        <div id="tf-timeline"></div>
        <hr class="divider">
        <div id="tf-items"></div>
        <div class="summary-row total"><span>Tổng cộng</span><span>${cfFormatVND(order.total)}</span></div>
        <div class="text-muted mt-8" style="font-size:13px;">Khung giờ nhận món: <b>${order.pickupSlot}</b></div>
      </div>`;
    cfRenderTimeline(document.getElementById('tf-timeline'), order);
    document.getElementById('tf-items').innerHTML = order.items.map(i => `
      <div class="ticket-row"><span class="name">${i.name} <span class="qty">x${i.qty}</span></span><span>${cfFormatVND(i.price*i.qty)}</span></div>
    `).join('');
  }

  function doTrackingLookup(){
    const code = document.getElementById('tf-code').value.trim();
    const phone = document.getElementById('tf-phone').value.trim();
    const res = cfFindOrderForTracking(code, phone);
    if (!res.ok){
      document.getElementById('tracking-result').innerHTML = `<div class="empty-state"><span data-icon="info"></span><h3>Không tìm thấy đơn hàng</h3><p>${res.message}</p></div>`;
      cfFillIcons();
      return;
    }
    renderTrackingResult(res.order);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tracking-form').addEventListener('submit', (e) => { e.preventDefault(); doTrackingLookup(); });
    const params = new URLSearchParams(location.search);
    if (params.get('code')){
      document.getElementById('tf-code').value = params.get('code');
      const order = cfGetOrderByCode(params.get('code'));
      if (order) document.getElementById('tf-phone').value = order.guestPhone || '';
      if (order) renderTrackingResult(order);
    }
  });
</script>
</body>
</html>
