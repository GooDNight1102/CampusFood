<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu đơn hàng — CampusFood</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/enhance.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="manifest" href="manifest.json">
</head>
<body data-page="tracking">

<div id="site-header"></div>

<main>
  <div class="container page-head">
    <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Tra cứu đơn hàng</div>
    <h1>Tra cứu đơn hàng</h1>
    <p class="text-muted mt-8">Không cần đăng nhập — chỉ cần mã đơn và số điện thoại.</p>
  </div>

  <section class="section" style="padding-top:20px;">
    <div class="container" style="max-width:760px;">
      <form class="panel" id="tracking-form">
        <div class="field-row">
          <div class="field" style="margin-bottom:0;">
            <label>Mã đơn hàng</label>
            <input type="text" id="tf-code" placeholder="VD: CF20260914001" required>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Số điện thoại</label>
            <input type="tel" id="tf-phone" placeholder="09xxxxxxxx" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-24">TRA CỨU ĐƠN HÀNG</button>
      </form>

      <div id="tracking-result" class="mt-24"></div>
    </div>
  </section>
</main>

<div id="bottom-nav"></div>
<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/main.js"></script>
<script src="js/enhancements.js"></script>
<script>
let CF_TRACKING_CODE = null;
let CF_TRACKING_REFRESH = null;

const TRACK_STEPS = [
  { key:'placed',    label:'Đã đặt',       icon:'📝' },
  { key:'preparing', label:'Đang chuẩn bị', icon:'👨‍🍳' },
  { key:'ready',     label:'Sẵn sàng',     icon:'🛎️' },
  { key:'done',      label:'Đã nhận',      icon:'✅' },
];

function cfStepIndex(status){
  return { placed:0, preparing:1, ready:2, done:3, cancelled:-1 }[status] ?? 0;
}

function renderTrackingResult(order){
  const wrap = document.getElementById('tracking-result');
  const idx = cfStepIndex(order.status);
  const cancelled = order.status === 'cancelled';

  const timelineHtml = cancelled
    ? `<div class="track-cancelled">❌ Đơn hàng đã bị huỷ</div>`
    : `<div class="track-timeline">
        ${TRACK_STEPS.map((s, i) => {
          const state = i < idx ? 'done' : i === idx ? 'current' : 'pending';
          return `
            <div class="track-step ${state}">
              <div class="track-dot">${i < idx ? '✓' : s.icon}</div>
              <div class="track-label">${s.label}</div>
              ${i < TRACK_STEPS.length - 1 ? '<div class="track-line"></div>' : ''}
            </div>`;
        }).join('')}
      </div>`;

  wrap.innerHTML = `
    <div class="panel track-panel">
      <div class="flex justify-between items-center">
        <div>
          <div class="eyebrow-label">MÃ ĐƠN ${order.code}</div>
          <h3 style="margin-top:4px;">${order.guestName || 'Khách hàng'}</h3>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <span class="status-pill ${cfOrderStatusPillClass(order.status)}">${cfOrderStatusLabel(order.status)}</span>
          ${order.priority ? '<span class="badge badge-bestseller" style="position:static;">Ưu tiên GV</span>' : ''}
        </div>
      </div>

      ${timelineHtml}

      <div class="track-info">
        <span>⏰ Khung giờ nhận: <b>${order.pickupSlot || '—'}</b></span>
        <span class="track-refresh" id="track-refresh">🔄 Tự động cập nhật sau <b id="track-countdown">5</b>s</span>
      </div>

      <hr class="divider">
      ${order.items.map(i => `
        <div class="ticket-row">
          <span class="name">${i.name} <span class="qty">x${i.qty}</span></span>
          <span>${cfFormatVND(i.price * i.qty)}</span>
        </div>`).join('')}
      <div class="summary-row total"><span>Tổng cộng</span><span>${cfFormatVND(order.total)}</span></div>
    </div>`;
}

function doTrackingLookup(){
  const code = document.getElementById('tf-code').value.trim();
  const phone = document.getElementById('tf-phone').value.trim();
  const res = cfFindOrderForTracking(code, phone);
  if (!res.ok){
    document.getElementById('tracking-result').innerHTML = `
      <div class="empty-state">
        <span data-icon="info"></span>
        <h3>Không tìm thấy đơn hàng</h3>
        <p>${res.message}</p>
      </div>`;
    cfFillIcons();
    return;
  }
  CF_TRACKING_CODE = res.order.code;
  renderTrackingResult(res.order);
  startAutoRefresh();
}

function startAutoRefresh(){
  clearInterval(CF_TRACKING_REFRESH);
  let count = 5;
  const countEl = document.getElementById('track-countdown');

  CF_TRACKING_REFRESH = setInterval(() => {
    count--;
    if (countEl) countEl.textContent = count;
    if (count <= 0){
      const order = cfGetOrderByCode(CF_TRACKING_CODE);
      if (order){
        renderTrackingResult(order);
        const newCount = document.getElementById('track-countdown');
        if (newCount) newCount.textContent = '5';
      }
      count = 5;
    }
  }, 1000);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tracking-form').addEventListener('submit', (e) => {
    e.preventDefault();
    doTrackingLookup();
  });

  const params = new URLSearchParams(location.search);
  if (params.get('code')){
    document.getElementById('tf-code').value = params.get('code');
    const order = cfGetOrderByCode(params.get('code'));
    if (order){
      document.getElementById('tf-phone').value = order.guestPhone || '';
      CF_TRACKING_CODE = order.code;
      renderTrackingResult(order);
      startAutoRefresh();
    }
  }
});
</script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/promotions.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/main.js"></script>
<script src="js/enhancements.js"></script>   <!-- ← THÊM DÒNG NÀY --></body>
</html>
